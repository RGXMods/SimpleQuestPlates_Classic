variables:
  GITHUB_MIRROR_REPOSITORY: RGXMods/SimpleQuestPlates_Classic

include:
  - project: rgxmods/warcraft/RGX-Framework
    ref: main
    file: /.gitlab/ci/addon.yml

release:metadata-regression:
  stage: validate
  image: node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: on_success
  script:
    - node tools/release/test-curseforge-metadata.mjs
